<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neo Perreo Berlin</title>
  <link rel="icon" type="image/png" href="Papi_Perreo-45.png">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    :root {
      --bg: #0a0a0a;
      /* content width: full screen on phones, capped on desktop */
      --w: min(100vw, 520px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; background: var(--bg); }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Plain dark band behind the logo (pattern starts below it) */
    header {
      position: relative;
      z-index: 2;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: calc(var(--w) * 0.10);
      min-height: calc(var(--w) * 0.415);
      overflow: hidden;

    }

    /* Animated pattern band behind the logo.
       The PNG is used as a mask, so its shape is filled with live gradients:
       a dark base, a pink->orange layer and an orange->pink layer that
       cross-fade into each other, each with a blurred copy underneath as glow. */
    .pattern {
      --pink: #ff10b8;
      --orange: #ff5a14;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: var(--w);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .pattern .layer, .pattern .m, .pattern .glow {
      position: absolute;
      inset: 0;
    }

    /* dark base keeps the black middle exactly as before */
    .pattern .base .m { background: #111; }

    /* colour only on the outer ~27% on each side, fading into the dark middle */
    .pattern .a .m {
      background: linear-gradient(90deg,
        var(--pink) 0%, rgba(255,16,184,0.55) 12%, rgba(255,16,184,0) 27%,
        rgba(255,90,20,0) 73%, rgba(255,90,20,0.55) 88%, var(--orange) 100%);
    }
    .pattern .b .m {
      background: linear-gradient(90deg,
        var(--orange) 0%, rgba(255,90,20,0.55) 12%, rgba(255,90,20,0) 27%,
        rgba(255,16,184,0) 73%, rgba(255,16,184,0.55) 88%, var(--pink) 100%);
    }

    .pattern .glow {
      filter: blur(calc(var(--w) * 0.018)) brightness(1.5) saturate(1.3);
      opacity: 0.35;
    }

    /* Layer b (swapped colours) is only visible inside a soft horizontal band.
       The band scrolls upward, so the pink<->orange swap and its glow
       roll up through the pattern like a travelling pulse of light. */
    .pattern {
      --band: calc(var(--w) * 0.5);   /* distance between two pulses */
      --speed: 3.2s;                  /* time for a pulse to travel one band */
    }

    .pattern .b {
      --soft: linear-gradient(to bottom, transparent 0%, #000 50%, transparent 100%);
      -webkit-mask-image: var(--soft);
      mask-image: var(--soft);
      -webkit-mask-size: 100% var(--band);
      mask-size: 100% var(--band);
      -webkit-mask-repeat: repeat-y;
      mask-repeat: repeat-y;
      animation: np-rise var(--speed) linear infinite;
    }

    .pattern .b .glow { opacity: 1; }

    @keyframes np-rise {
      from { -webkit-mask-position: 0 0; mask-position: 0 0; }
      to   { -webkit-mask-position: 0 calc(var(--band) * -1); mask-position: 0 calc(var(--band) * -1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pattern .b { animation: none; }
    }

    /* Pink divider line (same pink as the button outlines), exactly as wide as the pattern area */
    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      width: var(--w);
      height: calc(var(--w) * 0.01125);
      transform: translateX(-50%);
      background: #e833b4;
      z-index: 3;
      pointer-events: none;
    }

    .logo {
      position: relative;
      display: block;
      width: calc(var(--w) * 0.57);
      height: auto;
    }

    /* Pattern area with the buttons */
    main {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--w) * 0.14);
      padding: calc(var(--w) * 0.16) 0 calc(var(--w) * 0.05);
      overflow: hidden;
    }

    /* Black line art turned into faint grey lines on the dark background */
    main::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: var(--w);
      transform: translateX(-50%);
      background-image: url("Background_Pattern.png");
      background-repeat: repeat;
      background-position: top center;
      background-size: calc(var(--w) * 1.35) auto;
      filter: invert(1);
      opacity: 0.09;
      pointer-events: none;
    }

    /* Clickable image tiles (links + bone button) */
    .tile {
      position: relative;
      display: block;
      transition: transform 0.15s ease;
    }

    .tile:hover { transform: scale(1.04); }
    .tile:active { transform: scale(0.97); }

    .tile:focus-visible {
      outline: 3px solid #6cf24a;
      outline-offset: 6px;
    }

    .tile img {
      display: block;
      width: 100%;
      height: auto;
    }

    .tile.wide { width: calc(var(--w) * 0.675); }

    /* Bone button: half the size of the other buttons */
    button.tile {
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      width: 100%;
    }

    /* Wrapper keeps the bone button at half size and anchors the pointing hand */
    .bone-wrap {
      position: relative;
      width: calc(var(--w) * 0.3375);
    }

    /* Pointing hand: in after 1.5 s, visible 2 s, out for 1.5 s, repeat - until the bone is clicked */
    .hint-hand {
      position: absolute;
      left: 56%;
      top: 34%;
      width: 39px;
      height: 42px;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }

    .hint-hand svg { display: block; width: 100%; height: 100%; }

    .hint-ripple {
      position: absolute;
      left: calc(56% + 13px);
      top: 34%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 3px solid #6cf24a;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
    }

    /* hint-on = visible (fades in/out), hint-run = tap animation, started with the first show */
    .bone-wrap.hint-on .hint-hand { opacity: 1; }

    .bone-wrap.hint-run .hint-hand {
      animation: hint-tap 1.1s steps(1, end) infinite;
    }

    .bone-wrap.hint-on .hint-ripple {
      animation: hint-ripple 1.1s ease-out 0.3s infinite;
    }

    .bone-wrap.used .hint-hand,
    .bone-wrap.used .hint-ripple { display: none; }

    /* pixel-snapped tap: hand moves up toward the bone, then back */
    @keyframes hint-tap {
      0%   { transform: translateY(12px); }
      15%  { transform: translateY(6px); }
      30%  { transform: translateY(0); }
      45%  { transform: translateY(0); }
      60%  { transform: translateY(6px); }
      75%  { transform: translateY(12px); }
      100% { transform: translateY(12px); }
    }

    @keyframes hint-ripple {
      0%   { opacity: 0; transform: scale(0.4); }
      5%   { opacity: 0.9; }
      60%  { opacity: 0; transform: scale(2.2); }
      100% { opacity: 0; transform: scale(2.2); }
    }

    /* Insta + TikTok live in one block so the game can take their place */
    .social {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--w) * 0.14);
    }

    /* Game: replaces .social while playing */
    .game {
      display: none;
      position: relative;
      /* Almost full width; covers Insta, TikTok and the bone button */
      width: calc(var(--w) * 0.98);
      margin-top: calc(var(--w) * -0.11);
      margin-bottom: calc(var(--w) * -0.078);
      background: rgba(10, 10, 10, 0.94);
      border: 3px solid #e833b4;
      border-radius: 8px;
      overflow: hidden;
    }

    main.playing .social { display: none; }
    main.playing .game { display: block; }
    main.playing .bone-wrap { display: none; }

    .game canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .game-close {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 2;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #e833b4;
      background: #0a0a0a;
      color: #e833b4;
      font: 700 14px/1 sans-serif;
      cursor: pointer;
    }

    .game-close:hover { background: #e833b4; color: #0a0a0a; }
    .game-close:focus-visible { outline: 2px solid #6cf24a; outline-offset: 2px; }

    /* Footer */
    footer {
      position: relative;
      margin-top: auto;
      padding: calc(var(--w) * 0.12) 20px 0;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px;
      line-height: 1.8;
      color: #7a7a7a;
    }

    footer nav a {
      display: inline;
      width: auto;
      color: #9a9a9a;
      text-decoration: none;
      padding: 4px 2px;
      transition: color 0.15s ease;
    }

    footer nav a:hover { color: #e833b4; }

    footer nav a:focus-visible {
      outline: 2px solid #6cf24a;
      outline-offset: 2px;
    }

    footer .sep { margin: 0 8px; color: #4a4a4a; }

    @media (prefers-reduced-motion: reduce) {
      .bone-wrap.hint-run .hint-hand { animation: none; }
      .hint-ripple { display: none; }
      .tile { transition: none; }
      .tile:hover, .tile:active { transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="pattern" aria-hidden="true">
      <div class="layer base"><div class="m"></div></div>
      <div class="layer a"><div class="glow"><div class="m"></div></div><div class="m"></div></div>
      <div class="layer b"><div class="glow"><div class="m"></div></div><div class="m"></div></div>
    </div>
    <img class="logo" src="NP_Logo.png" alt="Neo Perreo Berlin">
  </header>

  <main>
    <!-- TODO: swap in the real ticket platform link when ready -->
    <a class="tile wide" href="https://www.ticketmaster.de" target="_blank" rel="noopener">
      <img src="Buy_Tickets_Box.png" alt="Buy Tickets">
    </a>

    <div class="social" id="social">
      <!-- TODO: replace with your real Instagram URL -->
      <a class="tile wide" href="https://www.instagram.com/" target="_blank" rel="noopener">
        <img src="Insta_Box.png" alt="Instagram">
      </a>

      <!-- TODO: replace with your real TikTok URL -->
      <a class="tile wide" href="https://www.tiktok.com/" target="_blank" rel="noopener">
        <img src="TikTok_Box.png" alt="TikTok">
      </a>
    </div>

    <!-- Jump & run: shown in place of Insta + TikTok -->
    <div class="game" id="game">
      <button class="game-close" id="game-close" type="button" aria-label="Close game">&#x2715;</button>
      <canvas id="game-canvas" tabindex="0" role="img"
              aria-label="Endless runner game. Tap or press space to jump over the obstacles."></canvas>
    </div>

    <div class="bone-wrap" id="bone-wrap">
      <button class="tile" id="bone-btn" type="button" aria-label="Click to throw bone (play the game)">
        <img src="Bone_Button.png" alt="Click to throw bone">
      </button>
      <!-- pixel hand that shows up after 2 s and points at the bone button -->
      <span class="hint-ripple" aria-hidden="true"></span>
      <span class="hint-hand" id="hint-hand" aria-hidden="true"></span>
    </div>

    <footer>
      <nav aria-label="Legal">
        <!-- TODO: point these at your real legal pages -->
        <a href="impressum.html">Impressum</a><span class="sep">·</span><a href="datenschutz.html">Datenschutz</a><span class="sep">·</span><a href="kontakt.html">Kontakt</a>
      </nav>
      <p>&copy; 2026 Neo Perreo Berlin</p>
    </footer>
  </main>
  <script>
  (() => {
    'use strict';

    const main     = document.querySelector('main');
    const social   = document.getElementById('social');
    const gameBox  = document.getElementById('game');
    const canvas   = document.getElementById('game-canvas');
    const ctx      = canvas.getContext('2d');
    const boneBtn  = document.getElementById('bone-btn');
    const boneWrap = document.getElementById('bone-wrap');
    const closeBtn = document.getElementById('game-close');

    const PINK = '#e833b4', GREEN = '#6cf24a', ORANGE = '#f0602d', DARK = '#0a0a0a';

    /* ------------------------------------------------------------------
       SPRITES  (all PNGs live in Game_Sprites/)
       w/h  = size in game units (game is 600 units wide)
       frames/fps = animated sheet (frames side by side)
       crop = [x, y, w, h] part of the PNG to use (trims transparent margins)
       If a file is missing, a simple placeholder shape is drawn instead.
       ------------------------------------------------------------------ */
    const SPRITES = {
      playerRun:  { src: 'Game_Sprites/Dog_Run.png',  w: 106, h: 83, frames: 6, fps: 8.33 },
      playerJump: { src: 'Game_Sprites/Dog_Jump.png', w: 106, h: 83, frames: 6, fps: 8.33 },
      bone:       { src: 'Game_Sprites/Bone.png', crop: [178, 284, 1306, 417], w: 84, h: 27 },
      beer:       { src: 'Game_Sprites/Beer.png', crop: [189, 236, 446, 1356], w: 22, h: 67 },
      zaza:       { src: 'Game_Sprites/Zaza.png', crop: [369, 97, 1232, 743],  w: 66, h: 40 },
      // Obstacles are still placeholders (set src to use real artwork)
      obstacleS:  { src: null, w: 34, h: 46 },
      obstacleL:  { src: null, w: 44, h: 66 }
    };
    // How much of the dog's box counts for collisions (forgiving)
    const HIT = { x: 0.25, top: 0.2 };

    for (const spr of Object.values(SPRITES)) {
      spr.img = null;
      if (spr.src) {
        const img = new Image();
        img.onload = () => { spr.img = img; };
        img.src = spr.src;
      }
    }

    function drawSprite(name, x, y, t, onGround, frame, rot) {
      const spr = SPRITES[name];
      if (rot) {
        ctx.save();
        ctx.translate(x + spr.w / 2, y + spr.h / 2);
        ctx.rotate(rot);
        x = -spr.w / 2; y = -spr.h / 2;
      }
      if (spr.img && spr.crop) {
        const c = spr.crop;
        ctx.drawImage(spr.img, c[0], c[1], c[2], c[3], x, y, spr.w, spr.h);
      } else if (spr.img) {
        const frames = spr.frames || 1;
        const fw = spr.img.naturalWidth / frames;
        const f = frame !== undefined ? Math.min(frame, frames - 1)
                : frames > 1 ? Math.floor(t * spr.fps) % frames : 0;
        ctx.drawImage(spr.img, f * fw, 0, fw, spr.img.naturalHeight, x, y, spr.w, spr.h);
      } else {
        PLACEHOLDERS[name](x, y, spr.w, spr.h, t, onGround);
      }
      if (rot) ctx.restore();
    }

    const PLACEHOLDERS = {
      playerJump(x, y, w, h, t) { PLACEHOLDERS.playerRun(x, y, w, h, t, false); },
      playerRun(x, y, w, h, t, onGround) {
        const step = onGround && Math.floor(t * 10) % 2 === 0;
        ctx.fillStyle = PINK;
        ctx.fillRect(x + 4, y + h * 0.25, w * 0.7, h * 0.45);
        ctx.fillRect(x + w * 0.55, y, w * 0.45, h * 0.4);
        ctx.fillRect(x, y + h * 0.2, 8, 8);
        ctx.fillStyle = ORANGE;
        ctx.fillRect(x + w * 0.58, y - 6, 8, 10);
        ctx.fillStyle = DARK;
        ctx.fillRect(x + w * 0.82, y + 8, 5, 5);
        ctx.fillStyle = PINK;
        ctx.fillRect(x + 8, y + h * 0.7, 8, h * 0.3 - (step ? 5 : 0));
        ctx.fillRect(x + w * 0.55, y + h * 0.7, 8, h * 0.3 - (step ? 0 : 5));
      },
      bone(x, y, w, h)  { ctx.fillStyle = ORANGE; ctx.fillRect(x, y, w, h); },
      beer(x, y, w, h)  { ctx.fillStyle = '#a55000'; ctx.fillRect(x, y, w, h); },
      zaza(x, y, w, h)  { ctx.fillStyle = '#f6efe0'; ctx.fillRect(x, y, w, h); },
      obstacleS(x, y, w, h) {
        ctx.fillStyle = ORANGE;
        ctx.fillRect(x, y + 8, w, h - 8);
        ctx.fillRect(x - 4, y, w + 8, 10);
      },
      obstacleL(x, y, w, h) {
        ctx.fillStyle = GREEN;
        ctx.fillRect(x, y + 10, w, h - 10);
        ctx.fillRect(x - 4, y, w + 8, 12);
        ctx.fillStyle = DARK;
        ctx.fillRect(x + 8, y + 22, 4, h - 30);
        ctx.fillRect(x + w - 12, y + 22, 4, h - 30);
      }
    };

    /* ---------------------------- game state --------------------------- */
    const LW = 600;               // logical width; height follows the box shape
    let LH = 400, groundY = 354, ratio = 0.73;
    let isOpen = false, state = 'intro', raf = 0, last = 0;
    let t = 0, speed = 0, distance = 0, nextGap = 0, nextItem = 0, overAt = 0;
    let introT = 0, bonus = 0, hi = 0, tapHintDone = false;
    try { hi = parseInt(localStorage.getItem('np-hi') || '0', 10) || 0; } catch (e) {}

    const INTRO_DUR = 0.8;        // seconds the bone is on screen (first pixel in -> last pixel out)
    const BONE_SPIN = 11;         // radians per second
    const GRAVITY = 1800, JUMP_V = -620;

    const player = { x: 50, y: 0, vy: 0, air: 0 };
    let obstacles = [], items = [], pops = [];

    const score = () => Math.floor(distance / 12) + bonus;

    function resetGame() {
      t = 0; distance = 0; speed = 280; bonus = 0;
      obstacles = []; items = []; pops = [];
      nextGap = 420; nextItem = 320;
      player.y = groundY - SPRITES.playerRun.h; player.vy = 0; player.air = 0;
    }

    function startRound() {       // bone throw -> dog runs
      resetGame();
      state = 'intro';
      introT = 0;
    }

    function fit() {
      const boxW = gameBox.clientWidth;
      gameBox.style.height = Math.round(ratio * boxW) + 'px';
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(cw * dpr);
      canvas.height = Math.round(ch * dpr);
      const sc = cw / LW;
      LH = ch / sc;
      ctx.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      if (state !== 'running') player.y = groundY - SPRITES.playerRun.h;
    }

    function openGame() {
      if (isOpen) return;
      const socialH = social.offsetHeight;
      // Everything from the top of Insta to the bottom of the bone button gets covered
      const spanH = boneWrap.offsetTop + boneWrap.offsetHeight - social.offsetTop;
      main.classList.add('playing');
      const boxW = gameBox.clientWidth;
      const wpx = boxW / 0.98;
      // window = covered span + 0.188w (see margins of .game in the CSS)
      ratio = (spanH + 0.188 * wpx) / boxW;
      // the ground line stays exactly where it was in the previous, smaller window;
      // everything below it is new ground (space to tap)
      groundY = LW * (socialH + 0.22 * wpx) / boxW - 46;
      isOpen = true;
      fit();
      startRound();
      canvas.focus({ preventScroll: true });
      last = performance.now();
      raf = requestAnimationFrame(loop);
    }

    function closeGame() {
      if (!isOpen) return;
      isOpen = false;
      cancelAnimationFrame(raf);
      main.classList.remove('playing');
      gameBox.style.height = '';
      boneBtn.focus({ preventScroll: true });
    }

    function onGround() { return player.y >= groundY - SPRITES.playerRun.h - 0.5; }

    function action() {
      if (!isOpen) return;
      if (state === 'running') {
        if (onGround()) { player.vy = JUMP_V; tapHintDone = true; }
      } else if (state === 'over' && performance.now() - overAt > 350) {
        startRound();
      }
    }

    function die() {
      state = 'over';
      overAt = performance.now();
      if (score() > hi) {
        hi = score();
        try { localStorage.setItem('np-hi', String(hi)); } catch (e) {}
      }
    }

    function updatePops(dt) {
      for (const p of pops) { p.y -= 45 * dt; p.life -= dt; }
      pops = pops.filter(p => p.life > 0);
    }

    function update(dt) {
      t += dt;

      if (state === 'intro') {
        introT += dt;
        if (introT >= INTRO_DUR) state = 'running';
        return;
      }
      if (state === 'over') { updatePops(dt); return; }

      speed = Math.min(280 + t * 8, 560);
      distance += speed * dt;

      // dog physics
      const P = SPRITES.playerRun;
      const floorY = groundY - P.h;
      player.vy += GRAVITY * dt;
      player.y += player.vy * dt;
      if (player.y >= floorY) { player.y = floorY; player.vy = 0; player.air = 0; }
      else player.air += dt;

      // move things
      for (const o of obstacles) o.x -= speed * dt;
      for (const it of items) it.x -= speed * dt;
      obstacles = obstacles.filter(o => o.x + o.w > -20);
      items = items.filter(it => it.x + it.w > -20);
      updatePops(dt);

      // spawn obstacles (not right next to a fresh pickup)
      nextGap -= speed * dt;
      if (nextGap <= 0) {
        if (items.some(it => it.x > LW - 220)) {
          nextGap = 60;
        } else {
          const name = Math.random() < 0.6 ? 'obstacleS' : 'obstacleL';
          const sp = SPRITES[name];
          obstacles.push({ name, x: LW + 20, w: sp.w, h: sp.h });
          const min = speed * 0.85 + 140, max = speed * 1.5 + 260;
          nextGap = min + Math.random() * (max - min);
        }
      }

      // spawn pickups: beer (+50) and zaza (+100) at random heights, in random gaps,
      // sometimes as a little trail of 2-3
      nextItem -= speed * dt;
      if (nextItem <= 0) {
        if (obstacles.some(o => o.x > LW - 220)) {
          nextItem = 60;
        } else {
          const name = Math.random() < 0.55 ? 'beer' : 'zaza';
          const sp = SPRITES[name];
          const r = Math.random();
          const lift = r < 0.2 ? 4 : 4 + Math.random() * 150;      // ground .. top of jump
          const count = Math.random() < 0.25 ? 2 + Math.floor(Math.random() * 2) : 1;
          for (let i = 0; i < count; i++) {
            const arc = count > 1 ? Math.sin((i / (count - 1)) * Math.PI) * 28 : 0;
            items.push({ name, x: LW + 20 + i * (sp.w + 34), y: groundY - sp.h - lift - arc,
                         w: sp.w, h: sp.h, pts: name === 'beer' ? 50 : 100 });
          }
          nextItem = speed * (0.3 + Math.random() * 2.0) + 90 + (count - 1) * 100;
        }
      }

      // collisions with obstacles (slightly forgiving boxes)
      const px1 = player.x + P.w * HIT.x, px2 = player.x + P.w * (1 - HIT.x);
      const py1 = player.y + P.h * HIT.top, py2 = player.y + P.h;
      for (const o of obstacles) {
        const ox1 = o.x + 4, ox2 = o.x + o.w - 4;
        const oy1 = groundY - o.h + 4;
        if (px2 > ox1 && px1 < ox2 && py2 > oy1) { die(); return; }
      }

      // collecting pickups (generous box)
      const cx1 = player.x + P.w * 0.15, cx2 = player.x + P.w * 0.95;
      const cy1 = player.y + P.h * 0.05, cy2 = player.y + P.h;
      for (const it of items) {
        if (cx2 > it.x && cx1 < it.x + it.w && cy2 > it.y && cy1 < it.y + it.h) {
          it.x = -999;                       // removed on next filter
          bonus += it.pts;
          pops.push({ x: it.x === -999 ? player.x + P.w * 0.6 : it.x, y: player.y - 6,
                      text: '+' + it.pts, life: 0.8, color: it.pts > 50 ? GREEN : ORANGE });
        }
      }
    }

    function pad(n) { return String(n).padStart(5, '0'); }

    function draw() {
      ctx.clearRect(0, 0, LW, LH);

      // ground line (unchanged) ...
      ctx.fillStyle = PINK;
      ctx.fillRect(0, groundY, LW, 3);
      // ... and extended ground below it, with the same kind of dashes
      const below = LH - groundY - 3;
      const grd = ctx.createLinearGradient(0, groundY + 3, 0, LH);
      grd.addColorStop(0, 'rgba(232,51,180,0.16)');
      grd.addColorStop(1, 'rgba(232,51,180,0.04)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, groundY + 3, LW, below);
      const rows = [
        { dy: 10,  len: 14, gap: 26,  k: 1,    a: 0.45 },
        { dy: 36,  len: 24, gap: 52,  k: 0.8,  a: 0.30 },
        { dy: 70,  len: 34, gap: 90,  k: 0.65, a: 0.22 },
        { dy: 112, len: 48, gap: 140, k: 0.5,  a: 0.16 },
        { dy: 160, len: 60, gap: 190, k: 0.4,  a: 0.12 }
      ];
      for (const r of rows) {
        if (r.dy > below - 8) continue;
        ctx.fillStyle = 'rgba(232,51,180,' + r.a + ')';
        const period = r.len + r.gap;
        const o = (distance * r.k) % period;
        for (let x = -o; x < LW; x += period) ctx.fillRect(x, groundY + r.dy, r.len, 3);
      }

      for (const o of obstacles) drawSprite(o.name, o.x, groundY - o.h, t, false);
      for (const it of items) if (it.x > -900) drawSprite(it.name, it.x, it.y, t, false);

      // dog
      if (state === 'running' && !onGround()) {
        const f = Math.floor(player.air * SPRITES.playerJump.fps);   // plays once per jump
        drawSprite('playerJump', player.x, player.y, t, false, f);
      } else if (state === 'running') {
        drawSprite('playerRun', player.x, player.y, t, true);
      } else {
        drawSprite('playerRun', player.x, player.y, t, false, 0);    // standing frame
      }

      // the thrown bone: flies in from the left, spinning, to the right
      if (state === 'intro') {
        const p = Math.min(introT / INTRO_DUR, 1);
        const B = SPRITES.bone;
        const bx = -B.w + p * (LW + B.w);
        const by = groundY - 170 - 80 * Math.sin(Math.PI * p);
        drawSprite('bone', bx, by, t, false, undefined, introT * BONE_SPIN);
      }

      // "+50" pop-ups
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 20px ui-monospace, Menlo, Consolas, monospace';
      for (const p of pops) {
        ctx.globalAlpha = Math.min(1, p.life / 0.4);
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;

      // pixel hand showing where to tap (until the first jump)
      if (!tapHintDone && state !== 'over') drawTapHint();

      // HUD
      ctx.font = '700 16px ui-monospace, Menlo, Consolas, monospace';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillStyle = GREEN;
      ctx.fillText(pad(score()), 14, 12);
      ctx.fillStyle = 'rgba(108,242,74,0.55)';
      ctx.fillText('HI ' + pad(hi), 14, 34);

      // messages
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (state === 'intro') {
        ctx.fillStyle = PINK;
        ctx.font = '700 30px ui-monospace, Menlo, Consolas, monospace';
        ctx.fillText('FETCH!', LW / 2, LH * 0.3);
      } else if (state === 'over') {
        ctx.fillStyle = PINK;
        ctx.font = '700 30px ui-monospace, Menlo, Consolas, monospace';
        ctx.fillText('GAME OVER', LW / 2, LH * 0.3);
        ctx.fillStyle = GREEN;
        ctx.font = '700 16px ui-monospace, Menlo, Consolas, monospace';
        ctx.fillText('TAP / SPACE TO RETRY', LW / 2, LH * 0.3 + 36);
      }
    }


    /* Pixel hand that taps the ground area */
    const HAND = [
      '....oo.......',
      '...offo......',
      '...offo......',
      '...offo......',
      '...offooo....',
      '...offoffoo..',
      '...offoffofo.',
      'oo.offffffffo',
      'ofoofffffffo.',
      '.offfffffffo.',
      '..offfffffo..',
      '..offfffffo..',
      '...offfffo...',
      '...ooooooo...'
    ];
    function drawTapHint() {
      const U = 4;                                   // size of one hand pixel
      const cx = LW / 2;
      const tipY = groundY + Math.min(95, (LH - groundY) * 0.42);   // fingertip rest position
      const cycle = (t % 1.1) / 1.1;                 // 0..1
      const press = cycle < 0.18 ? cycle / 0.18 : cycle < 0.3 ? 1 - (cycle - 0.18) / 0.12 : 0;
      const dip = Math.round(press * 3) * U;         // pixel-snapped tap movement
      const hx = Math.round((cx - 4.5 * U) / U) * U;
      const hy = Math.round((tipY + dip) / U) * U;

      // ripple at the fingertip
      if (cycle > 0.17 && cycle < 0.75) {
        const k = (cycle - 0.17) / 0.58;
        ctx.strokeStyle = 'rgba(108,242,74,' + (0.9 * (1 - k)) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, tipY + 3 * U, 8 + k * 30, 0, Math.PI * 2);
        ctx.stroke();
      }
      for (let r = 0; r < HAND.length; r++) {
        for (let c = 0; c < HAND[r].length; c++) {
          const ch = HAND[r][c];
          if (ch === '.') continue;
          ctx.fillStyle = ch === 'o' ? PINK : '#f6efe0';
          ctx.fillRect(hx + c * U, hy + r * U, U, U);
        }
      }
      ctx.fillStyle = GREEN;
      ctx.font = '700 14px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('TAP TO JUMP', cx, hy + HAND.length * U + 10);
    }

    function loop(now) {
      if (!isOpen) return;
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      update(dt);
      draw();
      raf = requestAnimationFrame(loop);
    }

    /* ------------------------------ events ----------------------------- */
    boneBtn.addEventListener('click', () => {
      boneWrap.classList.add('used');           // hint hand is no longer needed
      openGame();
    });
    closeBtn.addEventListener('click', closeGame);

    canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); action(); });

    window.addEventListener('keydown', (e) => {
      if (!isOpen) return;
      if (e.code === 'Escape') { closeGame(); return; }
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        if (document.activeElement === closeBtn && e.code === 'Space') return;
        e.preventDefault();
        if (!e.repeat) action();
      }
    });

    window.addEventListener('resize', () => { if (isOpen) { fit(); draw(); } });

    // build the pixel hand (inline SVG) and switch it on 2 s after load
    (() => {
      let rects = '';
      HAND.forEach((row, r) => {
        for (let c = 0; c < row.length; c++) {
          if (row[c] === '.') continue;
          rects += '<rect x="' + c + '" y="' + r + '" width="1" height="1" fill="' +
                   (row[c] === 'o' ? PINK : '#f6efe0') + '"/>';
        }
      });
      document.getElementById('hint-hand').innerHTML =
        '<svg viewBox="0 0 13 14" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' + rects + '</svg>';
      const FIRST_DELAY = 1500, VISIBLE_MS = 2000, HIDDEN_MS = 1500;
      function cycle(show) {
        if (boneWrap.classList.contains('used')) return;
        if (show) {
          boneWrap.classList.add('hint-run', 'hint-on');
          setTimeout(() => cycle(false), VISIBLE_MS);
        } else {
          boneWrap.classList.remove('hint-on');
          setTimeout(() => cycle(true), HIDDEN_MS);
        }
      }
      setTimeout(() => cycle(true), FIRST_DELAY);
    })();
  })();
  </script>
</body>
</html>
