<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neo Perreo Berlin</title>
  <meta name="theme-color" content="#0a0a0a">
  <style>
    :root {
      --bg: #0a0a0a;
      /* content width: full screen on phones, capped on desktop */
      --w: min(100vw, 520px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; background: var(--bg); }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Plain dark band behind the logo (pattern starts below it) */
    header {
      position: relative;
      z-index: 2;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: calc(var(--w) * 0.10);
      min-height: calc(var(--w) * 0.415);
      overflow: hidden;
    }

    /* Coloured pink-to-orange pattern band behind the logo */
    header::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: var(--w);
      transform: translateX(-50%);
      background-image: url("Background_Pattern_Top.png");
      background-repeat: no-repeat;
      /* image has transparent margins; scale/shift so the artwork fills the band */
      background-size: 101.76% auto;
      background-position: 0 calc(var(--w) * -0.0583);
      pointer-events: none;
    }

    .logo {
      position: relative;
      display: block;
      width: calc(var(--w) * 0.57);
      height: auto;
    }

    /* Pattern area with the buttons */
    main {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--w) * 0.14);
      padding: calc(var(--w) * 0.16) 0 calc(var(--w) * 0.05);
      overflow: hidden;
    }

    /* Black line art turned into faint grey lines on the dark background */
    main::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: var(--w);
      transform: translateX(-50%);
      background-image: url("Background_Pattern.png");
      background-repeat: repeat;
      background-position: top center;
      background-size: calc(var(--w) * 1.35) auto;
      filter: invert(1);
      opacity: 0.09;
      pointer-events: none;
    }

    main > a {
      position: relative;
      display: block;
      width: calc(var(--w) * 0.675);
      transition: transform 0.15s ease;
    }

    main > a:hover { transform: scale(1.04); }
    main > a:active { transform: scale(0.97); }

    main > a:focus-visible {
      outline: 3px solid #6cf24a;
      outline-offset: 6px;
    }

    main > a img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Footer */
    footer {
      position: relative;
      margin-top: auto;
      padding: calc(var(--w) * 0.12) 20px 0;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px;
      line-height: 1.8;
      color: #7a7a7a;
    }

    footer nav a {
      display: inline;
      width: auto;
      color: #9a9a9a;
      text-decoration: none;
      padding: 4px 2px;
      transition: color 0.15s ease;
    }

    footer nav a:hover { color: #e833b4; }

    footer nav a:focus-visible {
      outline: 2px solid #6cf24a;
      outline-offset: 2px;
    }

    footer .sep { margin: 0 8px; color: #4a4a4a; }

    @media (prefers-reduced-motion: reduce) {
      main > a { transition: none; }
      main > a:hover, main > a:active { transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="NP_Logo.png" alt="Neo Perreo Berlin">
  </header>

  <main>
    <!-- TODO: swap in the real ticket platform link when ready -->
    <a href="https://www.ticketmaster.de" target="_blank" rel="noopener">
      <img src="Buy_Tickets_Box.png" alt="Buy Tickets">
    </a>

    <!-- TODO: replace with your real Instagram URL -->
    <a href="https://www.instagram.com/" target="_blank" rel="noopener">
      <img src="Insta_Box.png" alt="Instagram">
    </a>

    <!-- TODO: replace with your real TikTok URL -->
    <a href="https://www.tiktok.com/" target="_blank" rel="noopener">
      <img src="TikTok_Box.png" alt="TikTok">
    </a>
    <footer>
      <nav aria-label="Legal">
        <!-- TODO: point these at your real legal pages -->
        <a href="impressum.html">Impressum</a><span class="sep">·</span><a href="datenschutz.html">Datenschutz</a><span class="sep">·</span><a href="kontakt.html">Kontakt</a>
      </nav>
      <p>&copy; 2026 Neo Perreo Berlin</p>
    </footer>
  </main>
</body>
</html>
